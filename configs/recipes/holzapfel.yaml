# ==============================================================================
# Benchmark Recipe: Anisotropic Holzapfel Material Model
# ==============================================================================

# 1. Synthetic Dataset Generation Config
material_model_name: holzapfel
disp_noise: 0.0001
load_noise: 0.01
target_load_true_top: 1.8
asym_factor: 0.95
n_loadsteps: 10

# 2. UGP Extraction (Training) Config
number_of_mci_sampling: 3
train_load_steps_indices: [1, 5, 9]
n_ip: 5
beta: 1.0
is_fixed_reaction_force_noise: 1
is_fixed_inducing_points: 1
is_include_prior_mean: 0
extraction_n_iterations: 40000
extraction_learning_rate: 0.01
model_mode: anisotropic

# 3. Distillation (Uncertainty-Aware Model Discovery) Config
distilled_material_model: gmr
distillation_n_iterations: 5000
distill_target: sef
sample_mode: standard_interp
num_points: 192
max_gamma: 1.0
do_sensitivity: 1
pruning_mode: ec
ec_threshold: 95.0
sobol_samples_factor: 1024
sobol_threshold: 1e-3
skip_distillation: 1

# 4. Validation Config
run_validation: 0
skip_validation: 1
val_load_steps_indices: [9]
val_number_samples: 1024
