# ==============================================================================
# Benchmark Recipe: Custom GT (C10=2.0, D1=1.0, D2=0.5)
# ==============================================================================

# 1. Synthetic Dataset Generation Config
material_model_name: c20d10d05
disp_noise: 0.0001
load_noise: 0.01
target_load_true_top: 4.0
asym_factor: 0.95
n_loadsteps: 10
geometry: block
mesh_size: 0.08

# 2. UGP Extraction (Training) Config
number_of_mci_sampling: 5
num_rff: 800
train_load_steps_indices: [0, 3, 5, 7, 9]
n_ip: 5
beta: 1.0
is_fixed_reaction_force_noise: 1
is_fixed_inducing_points: 1
is_include_prior_mean: 0
extraction_n_iterations: 100000
extraction_learning_rate: 0.01
covariance_mode: diag

# 3. Distillation (Uncertainty-Aware Model Discovery) Config
distilled_material_model: gmr
distillation_n_iterations: 20000
distill_target: sef_split
sample_mode: dataset_all
num_points: 256
max_gamma: 10.0
do_sensitivity: 1
sobol_threshold: 0.0001
sobol_samples_factor: 4096

# 4. Validation Config
run_validation: 1
val_load_steps_indices: [9]
val_number_samples: 1024
