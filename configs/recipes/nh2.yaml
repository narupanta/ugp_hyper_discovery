# ==============================================================================
# Benchmark Recipe: NeoHookean2 (nh2) Material Model
# ==============================================================================

# 1. Synthetic Dataset Generation Config
material_model_name: nh2
disp_noise: 0.0001
load_noise: 0.01
target_load_true_top: 1.5
asym_factor: 0.95
n_loadsteps: 10
geometry: block
mesh_size: 0.08
# 2. UGP Extraction (Training) Config
number_of_mci_sampling: 32
train_load_steps_indices: [1, 5, 9]
n_ip: 5
beta: 1.0
is_fixed_reaction_force_noise: 1
is_fixed_inducing_points: 1
is_include_prior_mean: 0
extraction_n_iterations: 50000
extraction_learning_rate: 0.01

# 3. Distillation (Uncertainty-Aware Model Discovery) Config
distilled_material_model: gmr
distillation_n_iterations: 2000
distill_target: sef_split
sample_mode: dataset_all
num_points: 128
max_gamma: 1.0
do_sensitivity: 1
sobol_threshold: 0.0001
sobol_samples_factor: 4096

# 4. Validation Config
run_validation: 1
val_load_steps_indices: [9]
val_number_samples: 1024
