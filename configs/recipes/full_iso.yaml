# ==============================================================================
# Benchmark Recipe: Full Isotropic (full_iso) Material Model
# Fully populated 10 deviatoric parameters and 3 volumetric parameters
# ==============================================================================

# 1. Synthetic Dataset Generation Config
material_model_name: full_iso
material_params:
  dev_params: [0.5, 0.8, 0.6, 0.7, 0.01, 0.01, 0.002, 0.001, 0.05, 3.0]
  vol_params: [1.0, 0.2, 0.3]
disp_noise: 0.0001
load_noise: 0.01
target_load_true_top: 8.0
asym_factor: 0.95
n_loadsteps: 10
geometry: block
mesh_size: 0.08

# 2. UGP Extraction (Training) Config
model_mode: isotropic
number_of_mci_sampling: 12
num_rff: 800
train_load_steps_indices: [0, 3, 6]
n_ip: 8
beta: 1.0
is_fixed_reaction_force_noise: 1
is_fixed_inducing_points: 1
is_include_prior_mean: 0
extraction_n_iterations: 50000
extraction_learning_rate: 0.01
covariance_mode: diag

# 3. Distillation (Uncertainty-Aware Model Discovery) Config
distilled_material_model: gmr
distillation_n_iterations: 5000
dev_vol_distillation_n_iterations: 5000
distill_target: sef_split
sample_mode: dataset_f
num_func_samples: 512
num_points: 256
max_gamma: 1.0
do_sensitivity: 1
sobol_threshold: 0.0001
sobol_samples_factor: 4096

# 4. Validation Config
run_validation: 1
val_load_steps_indices: [9]
val_number_samples: 3
seeds: [42]
