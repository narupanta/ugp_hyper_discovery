# ==============================================================================
# Benchmark Recipe: Symmetric Non-Orthogonal 60 / -60 deg (SymNonOrtho60)
# ==============================================================================

# 1. Synthetic Dataset Generation Config
material_model_name: symnonortho60
disp_noise: 0.0001
load_noise: 0.01
target_load_true_top: 5.0
asym_factor: 0.5
n_loadsteps: 10
geometry: block
mesh_size: 0.08

# 2. UGP Extraction (Training) Config
number_of_mci_sampling: 3
train_load_steps_indices: [1, 5, 9]
n_ip: 5
beta: 1.0
is_fixed_reaction_force_noise: 1
is_fixed_inducing_points: 1
is_include_prior_mean: 0
extraction_n_iterations: 30000
extraction_learning_rate: 0.01
model_mode: anisotropic
cap_compression: 0 

# 3. Distillation (Uncertainty-Aware Model Discovery) Config
distilled_material_model: gmr_aniso
distillation_n_iterations: 10
distill_target: sef_split
sample_mode: dataset_f
num_points: 256
max_gamma: 10.0
do_sensitivity: 1
sobol_threshold: 0.001
sobol_samples_factor: 4096

# 4. Validation Config
run_validation: 1
val_load_steps_indices: [9]
val_number_samples: 1024
